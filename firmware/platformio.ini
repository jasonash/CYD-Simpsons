; CYD-Simpsons firmware
;
; One [env] per supported board. Display wiring for TFT_eSPI is passed entirely
; through build flags so the library's User_Setup.h is never edited.
; Board-specific pins that the application itself needs live in src/boards/.

[platformio]
default_envs = cyd_2432s028r
description = Turn a Cheap Yellow Display into a tiny Simpsons television

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.6.0
    https://github.com/TheNitek/XPT2046_Bitbang_Arduino_Library.git

; ---------------------------------------------------------------------------
; ESP32-2432S028R: the standard 2.8" CYD. ILI9341 on HSPI, SD on VSPI,
; XPT2046 touch on its own (bit-banged) pins, DAC audio on GPIO26.
; ---------------------------------------------------------------------------
[env:cyd_2432s028r]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DCYD_BOARD_2432S028R=1
    ; --- TFT_eSPI configuration ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Bring-up / measurement sketch (src/bringup.cpp) on the same board.
[env:cyd_2432s028r_bringup]
extends = env:cyd_2432s028r
build_flags =
    ${env:cyd_2432s028r.build_flags}
    -DCYD_BRINGUP=1

; Some clones ship an ST7789 panel with inverted colors. Same pins, different
; driver. Flash this env if colors look wrong or the panel stays white.
[env:cyd_2432s028r_st7789]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DCYD_BOARD_2432S028R=1
    -DCYD_PANEL_ST7789=1
    -DUSER_SETUP_LOADED=1
    -DST7789_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
